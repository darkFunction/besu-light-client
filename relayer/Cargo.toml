[package]
name = "relayer"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.5.0", features = ["provider-http", "rpc-types", "consensus", "rlp", "trie", "provider-ws"] }
alloy-rlp = { version = "0.3.16", features = ["derive"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }


